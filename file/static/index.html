<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Document Chat</title>
<style>
:root{--bg:#f6f7f5;--panel:#ffffff;--ink:#1c2321;--muted:#6b7772;--line:#dde2df;--accent:#1f5f52;--user:#e4eeea}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--panel:#1b221f;--ink:#e6ebe8;--muted:#8a9791;--line:#2b3531;--accent:#5fb7a2;--user:#25332e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 Georgia,"Iowan Old Style",serif;background:var(--bg);color:var(--ink);display:flex}
button,input,textarea{font:inherit;color:inherit}
aside{width:280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:12px;overflow:hidden}
h1{font-size:18px;margin:0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}
.btn:focus-visible,.thread:focus-visible,#input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#threads{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.thread{text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread:hover{background:var(--bg)}
.thread.active{background:var(--user);font-weight:bold}
#doc{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
#doc b{color:var(--ink);word-break:break-all}
label.upload{display:block;margin-top:8px;border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer}
label.upload:hover{border-color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#log{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{white-space:pre-wrap;word-wrap:break-word;padding:10px 14px;border-radius:12px;max-width:88%}
.msg.user{background:var(--user);align-self:flex-end}
.msg.assistant{background:var(--panel);border:1px solid var(--line);align-self:flex-start}
.tool{font-size:13px;color:var(--muted);align-self:flex-start}
.empty{color:var(--muted);text-align:center;margin-top:20vh}
form{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
form .wrap{flex-direction:row;gap:8px}
#input{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);max-height:140px}
@media (max-width:720px){aside{display:none}}
</style>
</head>
<body>
<aside>
  <h1>Document Chat</h1>
  <button class="btn" id="new">New chat</button>
  <div id="threads" aria-label="Past conversations"></div>
  <div id="doc"></div>
  <label class="upload">Upload a PDF<input id="file" type="file" accept="application/pdf" hidden></label>
</aside>
<main>
  <div id="log"><div class="wrap" id="msgs"></div></div>
  <form id="form">
    <div class="wrap">
      <textarea id="input" rows="1" placeholder="Ask about your PDF, the web, or a stock price"></textarea>
      <button class="btn" id="send">Send</button>
    </div>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
let threadId = localStorage.getItem("threadId");
let threads = [], busy = false;

const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};

function addMsg(role, text = "") {
  $("msgs").querySelector(".empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text;
  $("msgs").appendChild(d); scroll(); return d;
}
const scroll = () => { $("log").scrollTop = $("log").scrollHeight; };

function renderThreads() {
  $("threads").innerHTML = "";
  threads.forEach(t => {
    const b = document.createElement("button");
    b.className = "thread" + (t.thread_id === threadId ? " active" : "");
    b.textContent = t.title; b.title = t.title;
    b.onclick = () => openThread(t.thread_id);
    $("threads").appendChild(b);
  });
}

async function loadDoc() {
  const d = await api(`/api/threads/${threadId}/document`);
  $("doc").innerHTML = d.filename
    ? `Using <b>${d.filename.replace(/</g, "&lt;")}</b><br>${d.chunks} chunks from ${d.documents} pages`
    : "No PDF indexed for this chat.";
}

async function openThread(id) {
  threadId = id; localStorage.setItem("threadId", id);
  $("msgs").innerHTML = "";
  const msgs = await api(`/api/threads/${id}/messages`);
  if (!msgs.length) $("msgs").innerHTML = '<div class="empty">Upload a PDF and ask a question.</div>';
  msgs.forEach(m => addMsg(m.role, m.content));
  renderThreads(); poll(id);
}

async function newChat() {
  const t = await api("/api/threads", { method: "POST" });
  threads.unshift(t); await openThread(t.thread_id);
}

async function send(text) {
  busy = true; $("send").disabled = true;
  addMsg("user", text);
  let bubble = null, toolEl = null;
  try {
    const res = await fetch(`/api/threads/${threadId}/chat`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    if (!res.ok) throw new Error(res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n"); buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith("data: ")) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type === "title") {
          const t = threads.find(t => t.thread_id === threadId);
          if (t) { t.title = ev.title; renderThreads(); }
        } else if (ev.type === "tool") {
          toolEl = document.createElement("div"); toolEl.className = "tool";
          toolEl.textContent = `Using ${ev.name}…`; $("msgs").appendChild(bubble = null || toolEl); scroll();
          bubble = null;
        } else if (ev.type === "token") {
          if (!bubble) bubble = addMsg("assistant");
          bubble.textContent += ev.content; scroll();
        } else if (ev.type === "error") {
          addMsg("assistant", "Something went wrong: " + ev.message);
        }
      }
    }
  } catch (e) { addMsg("assistant", "Couldn't reach the server: " + e.message); }
  busy = false; $("send").disabled = false; $("input").focus();
}

$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = ""; send(text);
};
$("input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
$("new").onclick = newChat;

async function poll(tid) {
  while (true) {
    const s = await api(`/api/threads/${tid}/ingest-status`);
    if (tid !== threadId) return;
    if (s.state === "running") {
      $("doc").textContent = `${s.stage}… ${s.progress}%`;
      await new Promise(r => setTimeout(r, 2000)); continue;
    }
    if (s.state === "error") { $("doc").textContent = "Indexing failed: " + s.message; return; }
    return loadDoc();
  }
}

$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const tid = threadId;
  $("doc").textContent = "Uploading " + f.name + "…";
  const fd = new FormData(); fd.append("file", f);
  try { await api(`/api/threads/${tid}/upload`, { method: "POST", body: fd }); }
  catch (err) { $("doc").textContent = "Upload failed: " + err.message; e.target.value = ""; return; }
  e.target.value = ""; poll(tid);
};

(async () => {
  threads = await api("/api/threads");
  if (threadId && threads.some(t => t.thread_id === threadId)) await openThread(threadId);
  else if (threads.length) await openThread(threads[0].thread_id);
  else await newChat();
})();
</script>
</body>
</html>
